<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telefon Karşılaştırma | Telefon Özelliklerini Karşılaştır</title>
  <meta name="description" content="Apple, Samsung, Xiaomi ve diğer markaların telefonlarını kamera, işlemci, RAM, ekran ve batarya özelliklerine göre karşılaştır.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ozknarc-spec.github.io/telefonkarsilastir/">
  <meta property="og:url" content="https://ozknarc-spec.github.io/telefonkarsilastir/">
  <link rel="stylesheet" href="style.css">
  <meta name="google-site-verification" content="McoHzZxDmzlGXAEIePT1lL_k0ucxNGN8V527LZLeuDw" />
</head>
<body>

  <header>
    <h1>📱 TelefonKarşılaştır</h1>
    <p>Türkiye'nin kapsamlı telefon karşılaştırma platformu.</p>
  </header>

  <section class="filtre-alani">
    <input
      type="text"
      id="arama-kutusu"
      placeholder="Marka, model veya işlemci ara... (örn: Samsung, A18, 120Hz)"
    >

    <select id="marka-filtresi">
      <option value="hepsi">Tüm Markalar</option>
    </select>

    <select id="siralama-secici">
      <option value="varsayilan">Sıralama: Varsayılan</option>
      <option value="batarya-azalan">Batarya: En Yüksek</option>
      <option value="ram-azalan">RAM: En Yüksek</option>
    </select>
  </section>

  <section id="karsilastirma-alani" class="karsilastirma-alani"></section>

  <section id="telefon-listesi" class="telefon-listesi"></section>

  <script src="app.js"></script>
</body>
</html>
