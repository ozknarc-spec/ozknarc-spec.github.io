<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelefonKarşılaştır</title>
  <link rel="stylesheet" href="style.css">
</head><meta name="google-site-verification" content="McoHzZxDmzlGXAEIePT1lL_k0ucxNGN8V527LZLeuDw" />
<body>

  <header>
    <h1>📱 TelefonKarşılaştır</h1>
    <p>Türkiye'nin kapsamlı telefon karşılaştırma platformu.</p>
  </header>

  <section class="filtre-alani">
    <input
      type="text"
      id="arama-kutusu"
      placeholder="Marka, model veya işlemci ara... (örn: Samsung, A18, 120Hz)"
    >

    <select id="marka-filtresi">
      <option value="hepsi">Tüm Markalar</option>
    </select>

    <select id="siralama-secici">
      <option value="varsayilan">Sıralama: Varsayılan</option>
      <option value="batarya-azalan">Batarya: En Yüksek</option>
      <option value="ram-azalan">RAM: En Yüksek</option>
    </select>
  </section>

  <section id="karsilastirma-alani" class="karsilastirma-alani"></section>

  <section id="telefon-listesi" class="telefon-listesi"></section>

  <script src="app.js"></script>
</body>
</html>
